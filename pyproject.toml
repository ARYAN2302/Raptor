[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "raptor"
version = "0.1.0"
description = "RAPTOR Phase 0-2 POC — raw IQ tokenizer + masked recon, leakage-safe splits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","torch>=2.2","scipy>=1.11","pyyaml>=6.0","tqdm>=4.66","einops>=0.7","scikit-learn>=1.3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
