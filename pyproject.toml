[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor"
version = "0.1.0"
description = "RAPTOR — Raw-IQ RF Perception for C-UAS: position+state from coherent IQ (range/az/el/velocity/uncertainty)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARYAN2302" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "torchaudio>=2.2",
    "scipy>=1.11",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "jupyter"]
sionna = ["sionna>=0.18", "tensorflow>=2.14"]
modal = ["modal>=0.60"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

